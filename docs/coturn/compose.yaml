# coturn: TURN relay for the WebRTC voice chat of the games on this server (karta.gamez.tn first).
# Players who cannot reach each other directly (phones on mobile data behind carrier NAT, strict Wi-Fi)
# send their audio through it. Settings and the shared secret are in ./turnserver.conf
# (start from turnserver.conf.example).
# Host networking; the firewall must open 3478 udp+tcp (TURN) and 50000-51999 udp (relayed audio).
#   start / apply changes:  docker compose up -d
#   logs:                   docker compose logs -f
# Production copy: /opt/coturn on radyou.tn.
name: coturn

services:
  coturn:
    image: coturn/coturn:4.18.0-debian
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
